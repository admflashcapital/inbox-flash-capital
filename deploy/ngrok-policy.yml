# Traffic policy do túnel da central — o gate que o Caddy fazia, agora na borda do ngrok.
#
# POR QUE ISTO EXISTE. Enquanto a central só publicava em 127.0.0.1, a proteção do
# `/twilio/callback` era topológica: ninguém alcançava a porta. Ao expor o túnel em dev
# (para destravar a resposta pela tela — ver AD-11.1), essa proteção desaparece, e o
# `Twilio::CallbackController` do Chatwoot **não valida assinatura nenhuma**. Sem este
# arquivo, qualquer um que descubra a URL forja uma mensagem inbound na conversa de um
# cliente real — e a central hoje tem PII de verdade.
#
# O inbound LEGÍTIMO chega ao monorepo de PRODUÇÃO (Railway), que valida a assinatura da
# Twilio e o relaya para cá pela internet, com o header `X-Relay-Token`. O Chatwoot não
# confere esse header — então quem confere é esta borda, e ela é a ÚNICA proteção do path.
#
# O token NÃO mora neste arquivo: `__RELAY_TOKEN__` é trocado pelo `RELAY_TOKEN` do `.env`
# na config gerada pelo `tuneis-manha.sh` do monorepo (arquivo 600, nunca impresso). Usado
# avulso, sem a troca, o marcador não casa com nada e o path fica negado — falha fechada.
#
# Uso: o `tuneis-manha.sh` embute este arquivo no endpoint `central` do agente da plataforma.
on_http_request:
  # 1. O path que aceita mensagem forjada. Falha fechada: nega tudo que não trouxer o token.
  - expressions:
      - >-
        req.url.path.startsWith('/twilio/callback')
        && !('x-relay-token' in req.headers
             && req.headers['x-relay-token'][0] == '__RELAY_TOKEN__')
    actions:
      - type: deny
        config:
          status_code: 403

  # 2. `/twilio/delivery_status` fica ABERTO de propósito: é a própria Twilio que o
  #    chama, do IP dela, para as mensagens que a CENTRAL envia — é justamente ele que
  #    o 21609 exige que seja alcançável. Forjá-lo só altera status de entrega de uma
  #    mensagem existente (impacto baixo, e sem PII no corpo).

  # 3. Headers que o Chatwoot não emite sozinho e o Caddy emitia.
  - expressions:
      - "true"
    actions:
      - type: add-headers
        config:
          headers:
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            X-Frame-Options: SAMEORIGIN
